name: Campanha

# Roda quando você publica uma release e, a cada 2 horas, para continuar o que ficou na fila.
# Com a fila vazia, revisa a wiki uma vez por semana.
on:
  release:
    types: [published]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      revisar:
        description: "Revisar a wiki agora"
        type: boolean
        default: false

# Uma execução por vez, as outras esperam na fila
concurrency:
  group: campanha
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REVISAR_AGORA: ${{ inputs.revisar }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Instalar ffmpeg e requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-requests

      - name: Transcrever e atualizar a wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 processar.py
