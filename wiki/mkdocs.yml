site_name: Os Salões de Arden Vul
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo claro

plugins:
  - search:
      lang: pt

markdown_extensions:
  - attr_list
  - md_in_html
  - tables

extra_css:
  - estilo.css

nav:
  - Início: index.md
  - Pergunte à IA: chat.md
  - Personagens: personagens/index.md
  - Mundo:
      - NPCs: npcs/index.md
      - Criaturas: criaturas/index.md
      - Locais: locais/index.md
      - Facções: faccoes/index.md
      - Itens: itens/index.md
  - História:
      - Sessões: sessoes/index.md
      - Linha do tempo: linha-do-tempo.md
      - Eventos: eventos/index.md
      - Pendências: pendencias.md
      - Transcrições: transcricoes/index.md
